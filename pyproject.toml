[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access_modifiers"
version = "1.0.0"
description = "Declarative API visibility and cooperative access contracts for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "access_modifiers contributors"}]
keywords = ["decorators", "api", "encapsulation", "visibility", "access-contracts"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
access-modifiers = "access_modifiers.checker:main"

[project.urls]
Homepage = "https://github.com/bvrznski/access_modifiers"
Repository = "https://github.com/bvrznski/access_modifiers"
Issues = "https://github.com/bvrznski/access_modifiers/issues"
