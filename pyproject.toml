[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessmod"
version = "1.0.0"
description = "Explicit boundaries. Pythonic freedom. — Declarative access modifiers and API contracts for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "accessmod contributors"}]
keywords = ["decorators", "api", "encapsulation", "visibility", "access-contracts"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
access-modifiers = "accessmod.checker:main"

[project.urls]
Homepage = "https://github.com/bvrznski/accessmod"
Repository = "https://github.com/bvrznski/accessmod"
Issues = "https://github.com/bvrznski/accessmod/issues"
